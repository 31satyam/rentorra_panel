{% extends 'base.html' %}

{% block title %}Page Not Found (404) | Rentorra{% endblock %}

{% block content %}
<section class="py-5 min-vh-75 d-flex align-items-center bg-light-surface text-center">
    <div class="container py-5">
        <div class="max-w-600 mx-auto">
            <span class="badge bg-danger-subtle text-danger fw-bold px-3 py-1 rounded-pill mb-3">ERROR 404</span>
            <h1 class="display-3 fw-extrabold text-navy mb-2">Page Not Found</h1>
            <p class="text-muted fs-5 mb-4">
                The rental listing or page you are looking for might have been leased, moved, or is temporarily unavailable.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'home' %}" class="btn btn-teal rounded-pill px-4 fw-bold">
                    <i class="bi bi-house-door me-1"></i>Back to Home
                </a>
                <a href="{% url 'property_list' %}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-search me-1"></i>Browse Available Homes
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
