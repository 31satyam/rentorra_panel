<div class="modal fade" id="globalEnquiryModal" tabindex="-1" aria-labelledby="globalEnquiryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header bg-slate text-white border-0 py-3 px-4 rounded-top-4">
                <div>
                    <h4 class="modal-title fs-5 fw-bold" id="globalEnquiryModalLabel">Enquire About This Property</h4>
                    <span class="small text-white-50" id="modalPropertySubtitle">Our rental specialist will reach out within 15 minutes.</span>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form action="{% url 'property_enquiry_submit' %}" method="POST" id="modalEnquiryForm">
                {% csrf_token %}
                <!-- Anti-spam Honeypot Field -->
                <input type="text" name="website_url_hp" style="display:none !important;" tabindex="-1" autocomplete="off">

                <!-- Hidden property data fields populated by JS -->
                <input type="hidden" name="property" id="modal_input_property_id" value="">
                <input type="hidden" name="city" id="modal_input_city" value="">
                <input type="hidden" name="bhk" id="modal_input_bhk" value="">
                <input type="hidden" name="min_budget" id="modal_input_min_budget" value="">
                <input type="hidden" name="max_budget" id="modal_input_max_budget" value="">

                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Your Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-teal"></i></span>
                            <input type="text" name="name" class="form-control border-start-0" placeholder="e.g. Vikram Sharma" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">10-Digit Mobile Number <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-teal"></i></span>
                            <input type="tel" name="phone" class="form-control border-start-0" placeholder="e.g. 9876543210" pattern="[0-9]{10}" maxlength="10" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Email (Optional)</label>
                            <input type="email" name="email" class="form-control" placeholder="name@email.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">Preferred Contact</label>
                            <select name="preferred_contact_method" class="form-select">
                                <option value="call">Phone Call</option>
                                <option value="whatsapp">WhatsApp</option>
                                <option value="email">Email</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Message or Move-in Timeline</label>
                        <textarea name="message" class="form-control" rows="2" placeholder="Looking for immediate visit, family / bachelors preferences..."></textarea>
                    </div>

                    <div class="p-2 bg-light rounded-3 text-muted small d-flex align-items-center mb-1">
                        <i class="bi bi-shield-check text-success fs-5 me-2"></i>
                        <span>Zero spam guaranteed. Direct assistance from Rentorra leasing team.</span>
                    </div>
                </div>

                <div class="modal-footer border-0 px-4 pb-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-teal rounded-pill px-4 fw-bold shadow-sm">
                        <i class="bi bi-send-fill me-1"></i>Submit Requirement
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
